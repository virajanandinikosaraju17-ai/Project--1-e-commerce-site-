<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — NovaCart</title>
  <link rel="icon" href="/images/favicon.svg" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/">
        <span class="logo-mark">N</span>
        <span>NovaCart</span>
      </a>
      <nav class="nav">
        <a href="/">Shop</a>
        <a class="cart-link" href="/cart.html">Cart <span class="cart-count" data-cart-count>0</span></a>
        <span class="nav" data-auth-slot></span>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="panel auth-wrap">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to reach your cart and orders.</p>
      <div class="alert" id="alert"></div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••" required />
        </div>
        <button class="btn btn-block" type="submit" id="submit">Sign in</button>
      </form>
      <p class="auth-alt">New to NovaCart? <a href="/register.html">Create an account</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span data-year></span> NovaCart. Built with Express, SQLite and vanilla JS.</span>
      <span>Free delivery over $150 · 30-day returns</span>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
